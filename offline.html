<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors connexion · ScoreLive</title>
<meta name="theme-color" content="#0a0f16">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(700px 300px at 50% -10%, rgba(47, 227, 155, .12), transparent 60%), #0a0f16;
    color: #e9eff7;
    text-align: center;
  }
  @media (prefers-color-scheme: light) {
    body { background: radial-gradient(700px 300px at 50% -10%, rgba(10, 168, 111, .1), transparent 60%), #f1f4f8; color: #0c1622; }
    p { color: #34485d !important; }
  }
  .box { max-width: 420px; }
  svg { width: 72px; height: 72px; margin: 0 auto 18px; display: block; border-radius: 20px; }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: #b7c3d2; line-height: 1.5; }
  a {
    display: inline-flex;
    align-items: center;
    height: 46px;
    padding: 0 22px;
    border-radius: 12px;
    background: linear-gradient(120deg, #2fe39b, #19b5ec);
    color: #03150e;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <main class="box">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#3DF5A8"/>
          <stop offset="1" stop-color="#12A6EA"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="18" fill="url(#g)"/>
      <path d="M9 35.5h10.5l5.2-12.5 8.6 21.5 6.2-15 3.4 6H55" fill="none" stroke="#04131F" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="16.5" r="5.2" fill="#04131F"/>
    </svg>
    <h1>Vous êtes hors connexion</h1>
    <p>ScoreLive a besoin d’Internet pour afficher les scores en direct. Vérifiez votre Wi-Fi, puis réessayez.</p>
    <a href="./">Réessayer</a>
  </main>
</body>
</html>
